<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anup's Tablet — Hardware</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="fullscreen center">
    <div class="device">
      <div class="statusbar">
        <div class="status-left"><span id="clockText"></span></div>
        <div class="status-right" id="statusIcons"></div>
      </div>

      <div class="hardware-wrap">
        <div class="carousel glass-strong">
          <div class="carousel-top">
            <div class="carousel-title">Hardware Projects</div>
            <div style="display:flex; gap:10px;">
              <button class="carousel-btn" id="prevBtn" aria-label="Previous">‹</button>
              <button class="carousel-btn" id="nextBtn" aria-label="Next">›</button>
            </div>
          </div>

          <div class="carousel-track" id="track">
            <!-- 3 cards injected by JS -->
          </div>
        </div>
      </div>

      <div class="dock liquid-glass" id="dock"></div>
    </div>
  </div>

  <script type="module" src="assets/js/hardware.js"></script>
</body>
</html>
