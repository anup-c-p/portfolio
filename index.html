<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anup's Tablet — Lock</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

  <!-- Preload wallpaper for faster first paint -->
  <link rel="preload" as="image" href="assets/img/wallpaper.jpg" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="fullscreen center">
    <div class="device" id="lockRoot">
      <!-- EDIT HERE: swap wallpaper image at assets/img/wallpaper.jpg -->
      <div class="wallpaper" style="background-image:url('assets/img/wallpaper.jpg');"></div>

      <div class="lock-top-title">Anup's Tablet</div>
      <div class="lock-hint">Tap the lock to unlock</div>

      <button class="lock-button" id="lockBtn" aria-label="Unlock"></button>
    </div>
  </div>

  <script type="module" src="assets/js/lock.js"></script>
</body>
</html>
