<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anup's Tablet — Lock</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="fullscreen center">
    <div class="device" id="lockRoot">
      <!-- EDIT HERE: swap wallpaper image at assets/img/wallpaper.jpg -->
      <div class="wallpaper" style="background-image:url('assets/img/wallpaper.jpg');"></div>

      <div class="lock-top-title">Anup's Tablet</div>
      <div class="lock-hint">Tap the lock to unlock</div>

      <button class="lock-button" id="lockBtn" aria-label="Unlock">
      <!-- Lock SVG with separate shackle path -->
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <!-- shackle -->
          <path id="lockShackle"
            d="M8 10V7.8C8 5.7 9.8 4 12 4s4 1.7 4 3.8V10"
            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
            <!-- body -->
          <path
            d="M7 10h10a2 2 0 0 1 2 2v6.5A2.5 2.5 0 0 1 16.5 21h-9A2.5 2.5 0 0 1 5 18.5V12a2 2 0 0 1 2-2Z"
            stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.95"/>
        </svg>
      </button>

    </div>
  </div>

  <script type="module" src="assets/js/lock.js"></script>
</body>
</html>
