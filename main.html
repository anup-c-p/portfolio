<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anup's Tablet — Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

  <!-- Preload app icons for snappy first paint -->
  <link rel="preload" as="image" href="assets/img/icons/app-video.png" />
  <link rel="preload" as="image" href="assets/img/icons/app-programming.png" />
  <link rel="preload" as="image" href="assets/img/icons/app-hardware.png" />
  <link rel="preload" as="image" href="assets/img/icons/app-startups.png" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="main-page">
  <div class="fullscreen center">
    <div class="device">
      <div class="statusbar">
        <div class="status-left"><span id="clockText"></span></div>
        <div class="status-right" id="statusIcons"></div>
      </div>

      <div class="homescreen">
        <div class="app-grid">
          <div class="apps">
            <!-- EDIT HERE: swap icons in assets/img/icons/ -->
            <a class="app-tile" href="video.html" aria-label="Video Editing">
              <img class="app-icon" src="assets/img/icons/app-video.png" alt="Video Editing" loading="eager" />
              <div class="app-label">Video Editing</div>
            </a>

            <a class="app-tile" href="programming.html" aria-label="Programming">
              <img class="app-icon" src="assets/img/icons/app-programming.png" alt="Programming" loading="eager" />
              <div class="app-label">Programming</div>
            </a>

            <a class="app-tile" href="hardware.html" aria-label="Hardware">
              <img class="app-icon" src="assets/img/icons/app-hardware.png" alt="Hardware" loading="eager" />
              <div class="app-label">Hardware</div>
            </a>

            <a class="app-tile" href="startups.html" aria-label="Startups">
              <img class="app-icon" src="assets/img/icons/app-startups.png" alt="Startups" loading="eager" />
              <div class="app-label">Startups</div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
