<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anup's Tablet — Video Editing</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="video-page">
  <div class="fullscreen center">
    <div class="device">
      <div class="statusbar">
        <div class="status-left"><span id="clockText"></span></div>
        <div class="status-right" id="statusIcons"></div>
      </div>

      <div class="video-header">Browse Videos</div>

      <div class="video-grid">
        <div class="video-row" id="videoRow">
          <!-- Cards generated by JS -->
        </div>
      </div>

      <!-- Dock -->
      <div class="dock liquid-glass" id="dock"></div>
    </div>
  </div>

  <script type="module" src="assets/js/video.js"></script>
</body>
</html>
